<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!--Form-->
    <form name="details" action="https://www.youtube.com/" target="_self" method="post" autocomplete="on">          <!--get-->
        <input type="email" placeholder="Email Address" autofocus><br>
        <input type="password" placeholder="Password" required><br>
        <input type="tel" placeholder="Phone Number" maxlength="10"><br>

        <input type="month"><br>
        <input type="week"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <input type="time"><br>

        <input type="number" min="-100" max="100" step="10" placeholder="0"><br>
        <input type="range"><br>
        
        <input type="color"><br>
        <input type="file" multiple><br>

        <input type="search" placeholder="Search Box" readonly><br>
        <input type="url" placeholder="URL Address" size="100"><br>

        <label for="db">Database</label><br>
        <input type="text" name="db" placeholder="Database" list="dbls">
        <datalist id="dbls">
            <option value="MySQL">SQL</option>
            <option value="MongoDB">NoSQL</option>
        </datalist><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    <hr>
    
    <select name="pl" size="1">
        <optgroup label="Structured Language">
            <option value="C" selected>C</option>
        </optgroup>
        <optgroup label="Object Oriented Language">
            <option value="C++">C++</option>
            <option value="Python">Python</option>
        </optgroup>
    </select><br>
    <textarea name="msg" cols="30" rows="10">Message</textarea>
    <hr>

    <form name="dev">
        <fieldset>
            <legend>Frontend</legend>
            <input type="radio" name="reactjs" value="reactjs">
            <label for="reactjs">React.js</label><br>
            <input type="radio" name="nextjs" value="nextjs">
            <label for="nextjs">Next.js</label>
        </fieldset>
        <fieldset>
            <legend>Backend</legend>
            <input type="checkbox" name="nodejs" value="nodejs">
            <label for="nodejs">Node.js</label><br>
            <input type="checkbox" name="expressjs" value="expressjs">
            <label for="expressjs">Express.js</label><br>
        </fieldset>
        <button type="button">Send</button>
    </form>
</body>
</html>
