<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics 3</title>
</head>
<body>
    <!--Forms-->
    <form name="details" action="https://www.youtube.com/" target="_self" method="GET" autocomplete="on">               <!--POST-->
        <input type="email" placeholder="Email Address" autofocus><br>
        <input type="password" placeholder="Password" required><br>
        <input type="tel" placeholder="Phone Number" maxlength="10"><br>

        <input type="month"><br>
        <input type="week"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <input type="time"><br>

        <input type="number" min="-100" max="100" step="10" placeholder="0"><br>
        <input type="range"><br>
        
        <input type="color"><br>
        <input type="file" multiple><br>

        <input type="search" placeholder="Search Box" readonly><br>
        <input type="url" placeholder="URL Address" size="100"><br>

        <label for="appd">Mobile App Dev</label><br>
        <input type="text" name="appd" id="appd" placeholder="Software" list="appd_">
        <datalist id="appd_">
            <option value="Native Android">Java or Kotlin</option>
            <option value="Flutter">Dart</option>
            <option value="React Native">JavaScript</option>
        </datalist><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    <hr>
    
    <label for="cpl">CP Language</label>
    <select name="cpl" id="cpl" size="1">
        <optgroup label="Structured Languages">
            <option value="C" selected>C</option>
        </optgroup>
        <optgroup label="Object Oriented Language">
            <option value="C++">C++</option>
            <option value="Python">Python</option>
        </optgroup>
    </select><br>
    <textarea name="msg" id="msg" cols="30" rows="10">Message</textarea>
    <hr>

    <form name="dev">
        <fieldset>
            <legend>Frontend Web Dev</legend>
            <input type="radio" name="html" id="html" value="HTML">
            <label for="html">HTML</label><br>
            <input type="radio" name="css" id="css" value="CSS">
            <label for="css">CSS</label><br>
            <input type="radio" name="js" id="js" value="JavaScript">
            <label for="js">JavaScript</label>
        </fieldset>
        <fieldset>
            <legend>Backend Web Dev</legend>
            <input type="checkbox" name="node" id="node" value="NodeJS">
            <label for="node">NodeJS</label><br>
            <input type="checkbox" name="exps" id="exps" value="ExpressJS">
            <label for="exps">ExpressJS</label><br>
            <input type="checkbox" name="mdb" id="mdb" value="MongoDB">
            <label for="mdb">MongoDB</label><br>
        </fieldset>
        <button type="button">Send</button>
    </form>
</body>
</html>
